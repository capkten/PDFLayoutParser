[build-system]
requires = ["maturin==1.8.7"]
build-backend = "maturin"

[project]
name = "hexai_pdf_parser"
version = "1.1.1"
description = "A Python library for parsing PDF layouts"
requires-python = ">=3.7"
dependencies = [
    "PyMuPDF",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.8.0",
    "numpy>=1.20.0",
    "opencv-python>=4.2.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
hexai_pdf_parser = "hexai_pdf_parser.cli:main"

[tool.maturin]
python-source = "src"
module-name = "hexai_pdf_parser._pdf_fast"
bindings = "pyo3"
include = [
    "src/hexai_pdf_parser/tables/table_templates/*.json",
    "src/hexai_pdf_parser/ml/table_detector_model/*.onnx",
]
exclude = [
    "output/**",
    "src/hexai_pdf_parser.egg-info/**",
    ".codegraph/**",
    ".cursor/**",
    ".gemini/**",
    ".superpowers/**",
    ".devops/**",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
